name: Build TIT COMP (VST3)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pruebas del nucleo del compresor: la curva estatica no cambia por accidente y el ataque del TIT MU
  # coincide con las medidas a 44.1 / 48 / 96 / 192 kHz.
  tests:
    name: tests (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -O1 -Wall tests/core_test.cpp -o core_test
      - run: g++ -std=c++17 -O1 -Wall tests/config_test.cpp -o config_test && ./config_test
      - run: ./core_test

  build:
    name: build (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows,   os: windows-latest }
          # macOS: una sola máquina (GitHub casi nunca da la de Apple Silicon). Compila universal (arm64 + x86_64) y el paso "Check architectures" comprueba que el binario trae las dos.
          - { id: mac-intel, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # un fallo de macOS (p. ej. falta de máquinas de GitHub) no tumba el resto del flujo
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Configure (macOS universal arm64 + x86_64)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build VST3
        run: cmake --build build --config Release --target TITCOMP_VST3 --parallel

      - name: Build AU (solo macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target TITCOMP_AU --parallel

      # Validador de plugins (solo informa: un fallo aqui no tumba el build)
      - name: pluginval (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip pv
          $v = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          .\pv\pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 120000 $v.FullName

      - name: pluginval (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          curl -L https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip -o pv.zip
          unzip -q pv.zip -d pv
          v=$(find build -type d -name "*.vst3" | head -1)
          ./pv/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 120000 "$v"

      - name: Zip VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          Compress-Archive -Path $v.FullName -DestinationPath "TITCOMP-Windows-VST3.zip"

      - name: "Check architectures (the macOS binary must contain arm64 and x86_64)"
        if: runner.os == 'macOS'
        run: |
          find build -type f \( -path "*.vst3/Contents/MacOS/*" -o -path "*.component/Contents/MacOS/*" \) -print0 | while IFS= read -r -d '' b; do
            a=$(lipo -archs "$b"); echo "$b: $a"
            case "$a" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::missing architecture in $b"; exit 1;; esac
          done

      - name: Zip VST3 + AU (macOS)
        if: runner.os == 'macOS'
        run: |
          v=$(find build -type d -name "*.vst3" | head -1)
          (cd "$(dirname "$v")" && zip -r -y "$GITHUB_WORKSPACE/TITCOMP-macOS-VST3-${{ matrix.id }}.zip" "$(basename "$v")")
          a=$(find build -type d -name "*.component" | head -1)
          (cd "$(dirname "$a")" && zip -r -y "$GITHUB_WORKSPACE/TITCOMP-macOS-AU-${{ matrix.id }}.zip" "$(basename "$a")")

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.id }}
          path: TITCOMP-*.zip

      # Paquete de Windows listo en cuanto termina su build, sin esperar a los Macs (que a veces tardan horas en cola)
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: TITCOMP-Windows
          path: TITCOMP-Windows-VST3.zip

  # Junta todo en UN solo artefacto / carpeta: Windows + macOS + código fuente
  package:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          path: TITCOMP
          merge-multiple: true
      - name: Quedarse con un solo zip de macOS por formato
        shell: bash
        run: |
          cd TITCOMP
          for k in VST3 AU; do
            files=(TITCOMP-macOS-$k-*.zip)
            if [ -e "${files[0]}" ]; then
              mv "${files[0]}" "TITCOMP-macOS-$k.zip"
              rm -f TITCOMP-macOS-$k-*.zip
            fi
          done
          ls -la
      - name: Source zip
        run: git archive --format=zip --prefix=TITCOMP/ -o TITCOMP/TITCOMP-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: TITCOMP-all
          path: TITCOMP/
      - name: Publish release (solo con tag, p. ej. v0.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TITCOMP/*.zip
